<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMKM Desa - Manik Maraja</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen relative">
    <div id="header-container"></div>

    <main class="max-w-6xl mx-auto px-4 py-8 flex-grow">
        <div class="mb-8 text-center md:text-left">
            <h1 class="text-3xl font-bold text-gray-800">UMKM Desa Manik Maraja</h1>
            <p class="text-gray-600 mt-2">Daftar usaha mikro, kecil, dan menengah lokal yang dikelola warga desa.</p>
        </div>

        <div id="umkm-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>
    </main>

    <div id="umkmModal" class="fixed inset-0 z-50 hidden bg-black bg-opacity-60 flex items-center justify-center p-4 transition-opacity">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden relative flex flex-col max-h-[90vh]">
            <button onclick="closeModal()" class="absolute top-4 right-4 bg-gray-200 text-gray-600 hover:bg-gray-300 rounded-full p-1.5 transition z-10">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            
            <div class="overflow-y-auto p-6">
                <h2 id="modalTitle" class="text-2xl font-extrabold text-gray-800 mb-4">Nama UMKM</h2>
                
                <img id="modalImage" src="" alt="Gambar UMKM" class="w-full h-48 object-cover rounded-xl mb-4 bg-gray-100 border border-gray-200 shadow-sm">
                
                <div class="bg-gray-50 p-4 rounded-xl border border-gray-100 mb-4">
                    <p class="text-gray-700 mb-1"><strong>Nama Penjual:</strong> <span id="modalOwner"></span></p>
                    <p class="text-gray-700"><strong>Nomor HP:</strong> <span id="modalPhone"></span></p>
                    
                    <a id="modalWaBtn" href="#" target="_blank" class="inline-flex items-center justify-center w-full mt-4 bg-green-500 text-white px-4 py-2.5 rounded-lg font-bold hover:bg-green-600 transition shadow-sm">
                        <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 24 24"><path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766.001-3.187-2.575-5.77-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.299.045-.677.063-1.092-.069-.252-.08-.575-.187-.988-.365-1.739-.751-2.874-2.502-2.961-2.617-.087-.116-.708-.94-.708-1.793s.448-1.273.607-1.446c.159-.173.346-.217.462-.217l.332.006c.106.005.249-.04.39.298.144.347.491 1.2.534 1.287.043.087.072.188.014.304-.058.116-.087.188-.173.289l-.26.304c-.087.086-.177.18-.076.354.101.174.449.741.964 1.201.666.598 1.216.774 1.39.86s.274.072.376-.043c.101-.116.433-.506.549-.68.116-.173.231-.145.39-.087s1.011.477 1.184.564c.173.087.289.129.332.202.043.073.043.423-.101.827z"></path></svg>
                        Hubungi via WhatsApp
                    </a>
                </div>
                
                <div class="mt-4">
                    <p class="font-bold text-gray-800 mb-2">Lokasi di Peta:</p>
                    <iframe id="modalMap" class="w-full h-48 rounded-xl border border-gray-200 shadow-sm" allowfullscreen="" loading="lazy"></iframe>
                    <a id="modalMapLink" href="#" target="_blank" class="text-blue-500 text-sm font-medium hover:underline mt-2 inline-flex items-center">
                        Buka di Google Maps Lengkap
                        <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-container"></div>

    <script>
        let globalUmkmData = {};

        // Ambil data dari file JSON saat halaman dimuat
        document.addEventListener("DOMContentLoaded", () => {
            fetch('./src/data/umkm.json')
                .then(response => response.json())
                .then(data => {
                    const container = document.getElementById('umkm-container');
                    let htmlContent = '';

                    data.forEach(item => {
                        // Simpan ke object global untuk referensi modal nanti
                        globalUmkmData[item.id] = item;

                        htmlContent += `
                            <div onclick="openModal('${item.id}')" class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition cursor-pointer">
                                <div class="h-40 bg-gray-100 relative overflow-hidden">
                                    <img src="${item.gambar}" alt="${item.namaUsaha}" class="w-full h-full object-cover">
                                </div>
                                <div class="p-5">
                                    <span class="bg-blue-100 text-blue-700 text-xs px-2.5 py-0.5 rounded-full font-semibold">${item.kategori}</span>
                                    <h3 class="text-lg font-bold text-gray-800 mt-2">${item.namaUsaha}</h3>
                                    <p class="text-gray-600 text-sm mt-1">${item.deskripsi}</p>
                                    <div class="mt-4 pt-3 border-t text-xs text-gray-500">
                                        <p><strong>Pemilik:</strong> ${item.namaPenjual}</p>
                                        <p><strong>Kontak:</strong> ${item.nomorHp}</p>
                                    </div>
                                </div>
                            </div>
                        `;
                    });

                    container.innerHTML = htmlContent;
                })
                .catch(error => console.error('Gagal memuat data UMKM:', error));
        });

        // Fungsi untuk membuka modal dan mengisi datanya
        function openModal(id) {
            const data = globalUmkmData[id];
            if(!data) return;

            document.getElementById('modalTitle').innerText = data.namaUsaha;
            document.getElementById('modalImage').src = data.gambar;
            document.getElementById('modalOwner').innerText = data.namaPenjual;
            document.getElementById('modalPhone').innerText = data.nomorHp;
            document.getElementById('modalWaBtn').href = 'https://wa.me/' + data.nomorWa;
            document.getElementById('modalMap').src = data.gmapsEmbed;
            document.getElementById('modalMapLink').href = data.gmapsLink;

            document.getElementById('umkmModal').classList.remove('hidden');
            document.body.style.overflow = 'hidden'; 
        }

        // Fungsi untuk menutup modal
        function closeModal() {
            document.getElementById('umkmModal').classList.add('hidden');
            document.body.style.overflow = 'auto'; 
        }

        // Tutup modal jika user mengklik area di luar kotak putih
        window.onclick = function(event) {
            const modal = document.getElementById('umkmModal');
            if (event.target === modal) {
                closeModal();
            }
        }
    </script>

    <script type="module">
        import { renderHeader, initHeaderEvents } from './src/components/Header.js';
        import { renderFooter } from './src/components/Footer.js';

        document.getElementById('header-container').innerHTML = renderHeader('umkm');
        document.getElementById('footer-container').innerHTML = renderFooter();
        initHeaderEvents();
    </script>
</body>
</html>
