<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMKM Desa - Manik Maraja</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen relative">
    <div id="header-container"></div>

    <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
        <div class="mb-8 text-center md:text-left">
            <h1 class="text-3xl font-bold text-gray-800">UMKM Desa Manik Maraja</h1>
            <p class="text-gray-600 mt-2">Daftar usaha mikro, kecil, dan menengah lokal yang dikelola warga desa.</p>
        </div>

        <div id="umkm-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>
    </main>

    <div id="umkmModal" class="fixed inset-0 z-50 hidden bg-black bg-opacity-60 flex items-center justify-center p-4 transition-opacity">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl overflow-hidden relative flex flex-col max-h-[90vh]">
            <button onclick="closeModal()" class="absolute top-4 right-4 bg-gray-200 text-gray-600 hover:bg-gray-300 rounded-full p-2 transition z-10">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>

            <div class="overflow-y-auto p-6 space-y-4">
                <h2 id="modalTitle" class="text-2xl font-extrabold text-gray-800">Nama Usaha</h2>

                <div>
                    <div class="w-full h-64 bg-gray-100 rounded-xl overflow-hidden border border-gray-200 shadow-sm mb-2">
                        <img id="modalMainImage" src="" alt="Gambar Utama UMKM" class="w-full h-full object-cover">
                    </div>
                    <div id="modalThumbnailContainer" class="flex gap-2 overflow-x-auto pb-2"></div>
                </div>

                <div class="bg-gray-50 p-4 rounded-xl border border-gray-100 space-y-2">
                    <p class="text-gray-700"><strong>Nama Penjual:</strong> <span id="modalOwner"></span></p>
                    <p class="text-gray-700"><strong>Nomor HP:</strong> <span id="modalPhone"></span></p>
                    <p class="text-gray-700"><strong>Jam Buka:</strong> <span id="modalOpenTime"></span></p>
                    <p class="text-gray-600 text-sm"><span id="modalDesc"></span></p>

                    <a id="modalWaBtn" href="#" target="_blank" class="inline-flex items-center justify-center w-full mt-2 bg-green-500 text-white px-4 py-3 rounded-xl font-bold hover:bg-green-600 transition shadow-sm">
                        <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 24 24"><path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766.001-3.187-2.575-5.77-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.299.045-.677.063-1.092-.069-.252-.08-.575-.187-.988-.365-1.739-.751-2.874-2.502-2.961-2.617-.087-.116-.708-.94-.708-1.793s.448-1.273.607-1.446c.159-.173.346-.217.462-.217l.332.006c.106.005.249-.04.39.298.144.347.491 1.2.534 1.287.043.087.072.188.014.304-.058.116-.087.188-.173.289l-.26.304c-.087.086-.177.18-.076.354.101.174.449.741.964 1.201.666.598 1.216.774 1.39.86s.274.072.376-.043c.101-.116.433-.506.549-.68.116-.173.231-.145.39-.087s1.011.477 1.184.564c.173.087.289.129.332.202.043.073.043.423-.101.827z"></path></svg>
                        Hubungi via WhatsApp
                    </a>
                </div>

                <div>
                    <p class="font-bold text-gray-800 mb-2">Lokasi di Peta:</p>
                    <iframe id="modalMap" class="w-full h-48 rounded-xl border border-gray-200 shadow-sm" allowfullscreen="" loading="lazy"></iframe>
                    <a id="modalMapLink" href="#" target="_blank" class="text-blue-600 text-sm font-medium hover:underline mt-2 inline-flex items-center gap-1">
                        Buka di Google Maps Lengkap →
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-container"></div>

    <script>
        let globalUmkmData = {};

        document.addEventListener("DOMContentLoaded", () => {
            loadUmkmData();
        });

        function formatWaNumber(phone) {
            if (!phone) return '';
            let cleaned = phone.replace(/\D/g, '');
            if (cleaned.startsWith('0')) {
                return '62' + cleaned.substring(1);
            }
            return cleaned;
        }

        function loadUmkmData() {
            fetch('./src/data/umkm.json')
                .then(response => response.json())
                .then(data => {
                    const container = document.getElementById('umkm-container');
                    container.innerHTML = '';
                    globalUmkmData = {};

                    data.forEach(item => {
                        globalUmkmData[item.id] = item;
                        let thumbImg = (item.gambar && item.gambar.length > 0) ? item.gambar[0] : 'https://via.placeholder.com/400x300';

                        container.innerHTML += `
                            <div onclick="openModal('${item.id}')" class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition cursor-pointer flex flex-col">
                                <div class="h-44 bg-gray-100 relative overflow-hidden">
                                    <img src="${thumbImg}" alt="${item.namaUsaha}" class="w-full h-full object-cover">
                                    <span class="absolute top-2 right-2 bg-black/60 text-white text-xs px-2 py-1 rounded-md backdrop-blur-sm">📷 ${item.gambar ? item.gambar.length : 0} Foto</span>
                                </div>
                                <div class="p-5 flex flex-col flex-grow">
                                    <span class="bg-blue-100 text-blue-700 text-xs px-2.5 py-0.5 rounded-full font-semibold self-start">${item.kategori}</span>
                                    <h3 class="text-lg font-bold text-gray-800 mt-2">${item.namaUsaha}</h3>
                                    <p class="text-gray-600 text-sm mt-1 line-clamp-2">${item.deskripsi}</p>
                                    <div class="mt-4 pt-3 border-t text-xs text-gray-500 space-y-1 mt-auto">
                                        <p><strong>Nama:</strong> ${item.namaPenjual}</p>
                                        <p><strong>No. HP:</strong> ${item.nomorHp}</p>
                                    </div>
                                    <div class="mt-3">
                                        <a href="${item.gmapsLink}" target="_blank" onclick="event.stopPropagation()" class="text-xs text-blue-600 hover:underline font-semibold flex items-center gap-1">
                                            📍 Lihat Lokasi di Google Maps
                                        </a>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                })
                .catch(error => console.error('Gagal memuat data:', error));
        }

        function openModal(id) {
            const data = globalUmkmData[id];
            if (!data) return;

            document.getElementById('modalTitle').innerText = data.namaUsaha;
            document.getElementById('modalOwner').innerText = data.namaPenjual;
            document.getElementById('modalPhone').innerText = data.nomorHp;
            document.getElementById('modalOpenTime').innerText = data.waktuBuka || 'Setiap Hari';
            document.getElementById('modalDesc').innerText = data.deskripsi;
            
            const waNumber = formatWaNumber(data.nomorHp);
            document.getElementById('modalWaBtn').href = `https://wa.me/${waNumber}?text=Halo%20${encodeURIComponent(data.namaPenjual)},%20saya%20tertarik%20dengan%20usaha%20${encodeURIComponent(data.namaUsaha)}`;
            
            document.getElementById('modalMap').src = data.gmapsEmbed || '';
            document.getElementById('modalMapLink').href = data.gmapsLink || '#';

            const mainImg = document.getElementById('modalMainImage');
            const thumbContainer = document.getElementById('modalThumbnailContainer');
            thumbContainer.innerHTML = '';

            if (data.gambar && data.gambar.length > 0) {
                mainImg.src = data.gambar[0];
                data.gambar.forEach((imgUrl) => {
                    thumbContainer.innerHTML += `
                        <img src="${imgUrl}" onclick="document.getElementById('modalMainImage').src='${imgUrl}'" class="w-16 h-16 object-cover rounded-lg border-2 border-transparent hover:border-blue-500 cursor-pointer flex-shrink-0 transition">
                    `;
                });
            } else {
                mainImg.src = 'https://via.placeholder.com/400x300';
            }

            document.getElementById('umkmModal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('umkmModal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('umkmModal');
            if (event.target === modal) closeModal();
        }
    </script>

    <script type="module">
        import { renderHeader, initHeaderEvents } from './src/components/Header.js';
        import { renderFooter } from './src/components/Footer.js';

        document.getElementById('header-container').innerHTML = renderHeader('umkm');
        document.getElementById('footer-container').innerHTML = renderFooter();
        initHeaderEvents();
    </script>
</body>
</html>
