<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Dokumentasi - Desa Manik Maraja</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">
    <div id="header-container"></div>

    <main class="max-w-4xl mx-auto px-4 py-8 flex-grow w-full">
        <div class="mb-6">
            <a href="galeri-kkn.html" class="inline-flex items-center text-sm font-semibold text-blue-600 hover:text-blue-800 transition bg-blue-50 px-4 py-2 rounded-lg border border-blue-100">
                ← Kembali ke Galeri KKN
            </a>
        </div>

        <div id="detail-content" class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="text-center py-12 text-gray-500">
                <p class="animate-pulse">Memuat dokumentasi...</p>
            </div>
        </div>
    </main>

    <div id="footer-container"></div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const galeriId = urlParams.get('id');
            const container = document.getElementById('detail-content');

            if (!galeriId) {
                container.innerHTML = `
                    <div class="p-8 text-center py-12">
                        <h3 class="text-xl font-bold text-gray-700">Dokumentasi Tidak Ditemukan</h3>
                        <p class="text-gray-500 text-sm mt-2">ID dokumentasi tidak valid.</p>
                        <a href="galeri-kkn.html" class="inline-block mt-4 text-sm text-blue-600 font-semibold">← Kembali</a>
                    </div>
                `;
                return;
            }

            fetch('./src/data/galeri.json')
                .then(res => res.json())
                .then(data => {
                    const item = data.find(g => g.id === galeriId);
                    if (!item) {
                        container.innerHTML = `
                            <div class="p-8 text-center py-12">
                                <h3 class="text-xl font-bold text-gray-700">Dokumentasi Tidak Ditemukan</h3>
                                <p class="text-gray-500 text-sm mt-2">Data dokumentasi dengan ID "${galeriId}" tidak ditemukan.</p>
                                <a href="galeri-kkn.html" class="inline-block mt-4 text-sm text-blue-600 font-semibold">← Kembali</a>
                            </div>
                        `;
                        return;
                    }

                    // Render Tampilan Detail Dokumentasi
                    container.innerHTML = `
                        <div class="w-full bg-gray-100 max-h-[480px] overflow-hidden flex items-center justify-center border-b border-gray-100">
                            <img src="${item.gambar}" alt="${item.judul}" class="w-full h-auto max-h-[480px] object-contain" onerror="this.parentElement.innerHTML='<div class=\\'p-12 text-gray-400 text-sm text-center\\'>Gambar tidak dapat dimuat</div>'">
                        </div>

                        <div class="p-6 md:p-8">
                            <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
                                <span class="bg-blue-100 text-blue-700 text-xs px-3 py-1 rounded-full font-semibold uppercase tracking-wider">${item.kategori || 'Dokumentasi'}</span>
                                <span class="text-xs text-gray-500 font-medium">🗓️ ${item.tanggal}</span>
                            </div>

                            <h1 class="text-2xl md:text-3xl font-bold text-gray-800 mb-4">${item.judul}</h1>
                            
                            <div class="prose max-w-none text-gray-600 leading-relaxed text-sm md:text-base border-t pt-4">
                                <p class="whitespace-pre-line">${item.deskripsi}</p>
                            </div>
                        </div>
                    `;
                })
                .catch(err => {
                    console.error(err);
                    container.innerHTML = `<div class="p-8 text-center text-red-500 text-sm">Gagal memuat data galeri dokumentasi.</div>`;
                });
        });
    </script>

    <script type="module">
        import { renderHeader, initHeaderEvents } from './src/components/Header.js';
        import { renderFooter } from './src/components/Footer.js';

        document.getElementById('header-container').innerHTML = renderHeader('kkn');
        document.getElementById('footer-container').innerHTML = renderFooter();
        initHeaderEvents();
    </script>
</body>
</html>
