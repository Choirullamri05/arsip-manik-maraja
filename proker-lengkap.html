<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Program Kerja KKN - Desa Manik Maraja</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">
    <div id="header-container"></div>

    <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
        <div class="mb-6">
            <a href="galeri-kkn.html" class="inline-flex items-center text-sm font-semibold text-blue-600 hover:text-blue-800 transition bg-blue-50 px-4 py-2 rounded-lg border border-blue-100">
                ← Kembali ke Galeri KKN
            </a>
        </div>

        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8 border-b pb-6">
            <div>
                <h1 class="text-3xl font-bold text-gray-800">🚀 Seluruh Program Kerja KKN</h1>
                <p class="text-gray-600 mt-1 text-sm">Daftar lengkap program kerja dan inovasi pengabdian masyarakat tim KKN Desa Manik Maraja.</p>
            </div>
            <div class="w-full md:w-72">
                <input type="text" id="search-input" placeholder="Cari program kerja..." class="w-full px-4 py-2 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm shadow-sm">
            </div>
        </div>

        <div id="proker-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full text-center py-12 text-gray-500 animate-pulse">
                Memuat daftar program kerja...
            </div>
        </div>
    </main>

    <div id="footer-container"></div>

    <script>
        let allProker = [];

        document.addEventListener("DOMContentLoaded", () => {
            const grid = document.getElementById('proker-grid');
            const searchInput = document.getElementById('search-input');

            // Fetch data dari proker.json
            fetch('./src/data/proker.json')
                .then(res => res.json())
                .then(data => {
                    allProker = data;
                    renderProker(allProker);
                })
                .catch(err => {
                    console.error(err);
                    grid.innerHTML = `<div class="col-span-full text-center py-12 text-red-500">Gagal memuat data program kerja.</div>`;
                });

            // Event listener untuk pencarian
            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase();
                const filtered = allProker.filter(item => 
                    item.judul.toLowerCase().includes(query) || 
                    item.deskripsi.toLowerCase().includes(query) ||
                    (item.pelaksana && item.pelaksana.toLowerCase().includes(query))
                );
                renderProker(filtered);
            });
        });

        function renderProker(items) {
            const grid = document.getElementById('proker-grid');
            if (items.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-12 text-gray-500">
                        <p class="text-lg font-semibold">Tidak ada program kerja yang cocok.</p>
                        <p class="text-sm mt-1">Coba kata kunci pencarian yang lain.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = items.map(item => `
                <div onclick="window.location.href='proker-detail.html?id=${item.id}'" class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm hover:shadow-md transition cursor-pointer flex flex-col justify-between group">
                    <div>
                        <div class="flex items-center justify-between mb-4">
                            <div class="w-12 h-12 ${item.warna || 'bg-blue-100 text-blue-600'} rounded-xl flex items-center justify-center font-bold text-2xl">
                                ${item.ikon || '📌'}
                            </div>
                            <span class="text-xs bg-gray-100 text-gray-600 px-2.5 py-1 rounded-full font-medium">🗓️ ${item.tanggal}</span>
                        </div>
                        <h3 class="font-bold text-gray-800 text-lg mb-2 group-hover:text-blue-600 transition">${item.judul}</h3>
                        <p class="text-gray-600 text-sm leading-relaxed line-clamp-3 mb-4">${item.singkat || item.deskripsi}</p>
                    </div>
                    <div class="pt-4 border-t flex items-center justify-between text-xs text-gray-500">
                        <span>👤 ${item.pelaksana || 'Tim KKN'}</span>
                        <span class="text-blue-600 font-semibold group-hover:translate-x-1 transition transform inline-block">Detail →</span>
                    </div>
                </div>
            `).join('');
        }
    </script>

    <script type="module">
        import { renderHeader, initHeaderEvents } from './src/components/Header.js';
        import { renderFooter } from './src/components/Footer.js';

        document.getElementById('header-container').innerHTML = renderHeader('kkn');
        document.getElementById('footer-container').innerHTML = renderFooter();
        initHeaderEvents();
    </script>
</body>
</html>
